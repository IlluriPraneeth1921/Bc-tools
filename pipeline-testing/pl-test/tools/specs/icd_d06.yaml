fields:
  # ─── Record Type 00: Extract File Information ─────────────────────────────
  "00":
    - name: record_type
      length: 2
      type: string
      required: true
      fixed_value: "00"
      db_column: RecordType
    - name: extract_date
      length: 8
      type: date
      format: YYYYMMDD
      required: true
      description: "Date extract is generated"
      db_column: ExtractDate
    - name: extract_period_start_date
      length: 8
      type: date
      format: YYYYMMDD
      description: "First date of extract reporting period (24 months in past)"
      db_column: ExtractPeriodStartDate
    - name: extract_period_end_date
      length: 8
      type: date
      format: YYYYMMDD
      description: "Last date of extract reporting period (current date)"
      db_column: ExtractPeriodEndDate
    - name: number_of_records
      length: 12
      type: numeric
      required: true
      zero_padded: true
      description: "Total rows excluding header"
      db_column: NumberOfRecords
    - name: number_of_providers
      length: 12
      type: numeric
      required: true
      zero_padded: true
      description: "Total unique MCD IDs"
      db_column: NumberOfProviders

  # ─── Record Type 01: Main Provider Information ────────────────────────────
