      format: YYYYMMDD
      db_column: WaiverProgramEndDate

  # ─── Record Type 11: Provider Waiver Service ──────────────────────────────
  "11":
    - name: record_type
      length: 2
      type: string
      fixed_value: "11"
      db_column: RecordType
    - name: medicaid_provider_number
      length: 15
      type: identifier
      db_column: MedicaidProviderNumber
    - name: waiver_service_code
      length: 6
      type: code
