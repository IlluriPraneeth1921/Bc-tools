# ═══════════════════════════════════════════════════════════════════════════════
# CODE TABLES (Appendices A through I)
# ═══════════════════════════════════════════════════════════════════════════════

code_tables:
  provider_name_type_codes:
    name: provider_name_type_codes
    description: "Provider Name Type indicator"
    values:
      "B": "Business Name"
      "P": "Personal Name"

  organization_type_codes:
    name: organization_type_codes
    description: "Appendix A - Organization Type Codes"
    values:
      "1": "For Profit"
      "2": "Other"
      "3": "Partnership"
      "4": "Sole Proprietor"
      "5": "County Agency"
      "6": "Not for Profit"
      "7": "Limited Liability"
      "8": "State Agency"
      "9": "Municipality"
      "A": "Tribal Agency"
      "B": "City or County Agency"
      "C": "Federal Government"

  location_status_codes:
    name: location_status_codes
    description: "Location Status Indicator"
    values:
      "I": "In-state"
      "O": "Out of State"
      "Y": "Out of State Youth"
      "E": "In-state Emergency"

  billing_indicator_codes:
    name: billing_indicator_codes
    description: "Billing Indicator"
    values:
      "Y": "Biller"
      "N": "Performer"
      "B": "Biller and Performer"
      "R": "Referring/Prescribing/Ordering"

  address_type_codes:
    name: address_type_codes
    description: "Address Type Code"
    values:
      "S": "Practice/Service location"
      "M": "Mailing Address"
      "P": "Pay To Address"
      "I": "IRS 1099 Address"

  tax_id_type_codes:
    name: tax_id_type_codes
    description: "Tax ID Type"
    values:
      "S": "Social Security Number"
      "F": "FEIN"

  contract_enrollment_status_codes:
    name: contract_enrollment_status_codes
    description: "Appendix B - Contract Enrollment Status"
    values:
      "1": "Found on SSA DMF"
      "2": "HCBS Settings Not Met"
      "3": "Terminated - DQA"
      "4": "Certification Ended"
      "5": "No Active WVR Service"
      "A": "Active"
      "B": "Limited Time Span"
      "C": "Change in Ownership"
      "D": "Deceased"
      "E": "Inactive"
      "F": "Terminated - DSPS"
      "G": "No Long Meet Crt Rqmt"
      "H": "Term - CMS or OIG"
      "I": "State Request"
      "J": "Term Ltr - Clinic"
      "K": "Term Ltr - Other"
      "L": "Duplicate Enrollment"
      "M": "Mail Returned"
      "N": "Moved to Non-border"
      "O": "Out of Business"
      "P": "Provider Request"
      "Q": "CMS Term Report"
      "R": "Retired"
      "S": "Limited Emergency Svc"
      "T": "License Expired"
      "U": "Failure to Revalidate"
      "V": "Certification Expired"
      "X": "NPPES Deactivated NPI"
      "Y": "Failure to Submit FP"
      "Z": "FP Processing Failed"

  aca_payment_hold_codes:
    name: aca_payment_hold_codes
    description: "ACA Payment Hold Indicator"
    values:
      "A": "ACA suspension is currently active"
      "C": "Provider has been cleared"
      "T": "Provider terminated due to investigation"

  waiver_program_codes:
    name: waiver_program_codes
    description: "Appendix C - Waiver Program Codes"
    values:
      "PACPB": "Family Care Partnership"
      "FAMCR": "Family Care"
      "PACE": "Program of All-Inclusive Care for the Elderly"
      "IRIS": "Include, Respect, I Self-Direct"

  waiver_service_codes:
    name: waiver_service_codes
    description: "Appendix D - Waiver Service Codes"
