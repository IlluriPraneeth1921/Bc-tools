meta:
  interface_type: icd_d06
  display_name: "ICD-D06: WI DHS Medicaid Provider File Extract"
  description: "Daily full-file extract of all Medicaid Providers with active contracts within the last 24 months. Pipe-delimited with 15 record types (00-14)."
  version: "2.0"
  source_system: "MMIS"
  file_extension: ".psv"

format:
  type: pipe-delimited
  delimiter: "|"
  has_header_record: true
  has_trailer_record: false
  line_ending: CRLF
  encoding: UTF-8

entity:
  id_field: medicaid_provider_number
  id_length: 15
  test_prefix: "000000000"
  id_description: "Medicaid Provider Number (proprietary provider ID)"

record_types:
  - code: "00"
    name: "Extract File Information"
    min_occurrence: 1
    max_occurrence: "1"
    per_entity: false
    position: first_line
  - code: "01"
    name: "Main Provider Information"
    min_occurrence: 1
    max_occurrence: "1"
    per_entity: true
  - code: "02"
    name: "Provider Address"
    min_occurrence: 3
    max_occurrence: "10"
    per_entity: true
  - code: "03"
    name: "Provider TIN"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "04"
    name: "Provider Contract"
    min_occurrence: 1
    max_occurrence: unlimited
    per_entity: true
  - code: "05"
    name: "Provider Type and Specialty"
    min_occurrence: 1
    max_occurrence: unlimited
    per_entity: true
  - code: "06"
    name: "Provider NPI"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "07"
    name: "Provider Taxonomy"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "08"
    name: "Provider ACA Payment Hold"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "09"
    name: "Provider Value Added"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "10"
    name: "Provider Waiver Program"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "11"
    name: "Provider Waiver Service"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "12"
    name: "Provider County and Tribe Served"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "13"
    name: "Provider License"
    min_occurrence: 0
