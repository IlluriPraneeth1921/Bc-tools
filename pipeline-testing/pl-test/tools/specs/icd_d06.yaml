# ═══════════════════════════════════════════════════════════════════════════════
# BUSINESS RULES
# ═══════════════════════════════════════════════════════════════════════════════

business_rules:
  - id: BR-D06-001
    description: "IRIS Providers identified by Waiver Program Code. Enumeration IDs (Medicaid Provider Number) used for matching."
    affects_fields: [medicaid_provider_number, waiver_program_code]
    logic: "waiver_program_code = 'IRIS' → provider is IRIS provider"
    type: filter
  - id: BR-D06-002
    description: "EVV Providers identified by Provider Type = '85'. Enumeration IDs (Medicaid Provider Number) used for matching."
    affects_fields: [medicaid_provider_number, provider_type_code]
    logic: "provider_type_code = '85' → provider is EVV provider"
    type: filter
  - id: BR-D06-003
    description: "New Org and EVV Providers will be loaded with an additional Location record."
    affects_fields: [medicaid_provider_number]
    logic: "new provider → create Organization + Location records"
    type: transformation
  - id: BR-D06-004
    description: "Enumeration IDs (Medicaid Provider Number) will be stored at both Organization and Location levels."
    affects_fields: [medicaid_provider_number]
    logic: "store ID → OrganizationIdentifiers + LocationIdentifiers"
    type: transformation
  - id: BR-D06-005
    description: "PHW Provider records will not be used to create new Organizations or Locations."
    affects_fields: [provider_type_code]
    logic: "provider_type_code = 'PHW' → skip record creation"
    type: filter
  - id: BR-D06-006
    description: "Providers not on daily file with active waiver program are end-dated."
    affects_fields: [waiver_program_end_date]
    logic: "provider absent from file + active waiver → set end date"
    type: transformation
  - id: BR-D06-007
    description: "Providers not on daily file with active status are end-dated."
    affects_fields: [contract_end_date]
    logic: "provider absent from file + active status → set end date"
    type: transformation
  - id: BR-D06-008
    description: "Waiver Service End Date used to capture service termination."
    affects_fields: [waiver_service_end_date]
    logic: "waiver_service_end_date populated → mark service inactive"
    type: transformation
  - id: BR-D06-009
    description: "Billing Indicator 'B' (Biller and Performer) → Location Type = Billing and Rendering."
    affects_fields: [billing_indicator]
    logic: "billing_indicator = 'B' → PrimaryTypeDisplayName = 'Billing and Rendering'"
    type: vocab_lookup
  - id: BR-D06-010
    description: "Billing Indicator 'Y' (Biller) → Location Type = Billing."
    affects_fields: [billing_indicator]
    logic: "billing_indicator = 'Y' → PrimaryTypeDisplayName = 'Billing'"
    type: vocab_lookup
  - id: BR-D06-011
    description: "Billing Indicator 'N' (Performer) → Location Type = Rendering."
    affects_fields: [billing_indicator]
    logic: "billing_indicator = 'N' → PrimaryTypeDisplayName = 'Rendering'"
    type: vocab_lookup
  - id: BR-D06-012
    description: "Billing Indicator 'R' (Referring) → Location Type = Referring/Prescribing/Ordering."
    affects_fields: [billing_indicator]
    logic: "billing_indicator = 'R' → PrimaryTypeDisplayName = 'Referring/Prescribing/Ordering'"
    type: vocab_lookup
  - id: BR-D06-013
    description: "Each Medicaid Provider ID creates one Organization and one Location in the system."
    affects_fields: [medicaid_provider_number]
    logic: "unique MCD ID → 1 Organization + 1 Location"
    type: composite
  - id: BR-D06-014
    description: "Effective dates captured as-is; no conversion or validation of future/past dates."
    affects_fields: [contract_effective_date, waiver_program_effective_date, waiver_service_effective_date]
    logic: "store date values as received"
    type: transformation
  - id: BR-D06-015
    description: "Waiver Service Codes received must exist in the WaiverServiceCode vocabulary."
    affects_fields: [waiver_service_code]
    logic: "waiver_service_code must exist in vocabulary → validation"
    type: validation
  - id: BR-D06-016
    description: "An Error Report shall be generated after processing with all rejected records."
    affects_fields: []
    logic: "processing errors → generate error report"
    type: validation
  - id: BR-D06-017
    description: "EVV Providers identified by Provider Type = '85' and Specialty = '850'."
    affects_fields: [provider_type_code, provider_specialty_code]
    logic: "type = '85' AND specialty = '850' → EVV provider"
    type: filter
  - id: BR-D06-018
    description: "Provider's Rendering/Location Address must be identified as current address."
    affects_fields: [address_type_code]
    logic: "address_type_code = 'S' → CurrentDisplayName = 'Yes'"
    type: transformation
  - id: BR-D06-019
    description: "Zip codes must be numeric and 5 digits. Extension appended with hyphen if present."
    affects_fields: [zip_code, zip_code_extension]
    logic: "zip_code + '-' + zip_code_extension → PhysicalAddressPostalCode"
    type: composite
  - id: BR-D06-020
    description: "When active WVR contract AND active IRIS waiver program, set StatusDisplayName = 'Active'."
    affects_fields: [provider_contract_code, contract_enrollment_status_code, waiver_program_code]
    logic: "contract_code = 'WVR' AND status = 'A' AND waiver = 'IRIS' → Status = 'Active'"
    type: composite
  - id: BR-D06-021
    description: "Taxonomy code used to resolve GroupingName, ClassificationName, SpecializationName via vocabulary lookup."
    affects_fields: [taxonomy_code]
    logic: "taxonomy_code → lookup GroupingName, ClassificationName, SpecializationName"
    type: vocab_lookup
  - id: BR-D06-022
    description: "When multiple NPI records exist, only the most recent active NPI is primary."
    affects_fields: [npi, npi_effective_date, npi_end_date]
    logic: "multiple NPIs → most recent active = primary"
    type: composite
  - id: BR-D06-023
    description: "When multiple TIN records exist, only the most recent active TIN is primary."
    affects_fields: [tax_id_number, tin_effective_date, tin_end_date]
    logic: "multiple TINs → most recent active = primary"
    type: composite

# ═══════════════════════════════════════════════════════════════════════════════
# DATABASE TARGETS
# ═══════════════════════════════════════════════════════════════════════════════

db_targets:
  stage1:
    database: "WiDHS.Qc.Interface.Carity.ToolTesting"
    schema: CustomerInterfaceModule
    tables:
      - name: MedicaidProviderRaw
        filter_column: MedicaidProviderNumber
  stage2:
    database: "WiDHS.Qc.Interface.Carity.ToolTesting"
    schema: CustomerInterfaceModule
    tables:
      - name: MedicaidProviderParsed
        columns:
          medicaid_provider_number: MedicaidProviderNumber
          provider_full_name: ProviderFullName
          provider_name_type: ProviderNameType
          billing_indicator: BillingIndicator
          revalidation_date: RevalidationDate
        filter_column: MedicaidProviderNumber
  stage3:
    database: "WiDHS.Qc.Interface.Carity.ToolTesting"
    schema: OrganizationModule
    tables:
      - name: Organization
        filter_column: OrganizationKey
      - name: Location
        filter_column: LocationKey
      - name: LocationIdentifiers
        filter_column: LocationKey
      - name: LocationAddresses
        filter_column: LocationKey
      - name: LocationCredentials
        filter_column: LocationKey
      - name: LocationSpecialty
        filter_column: LocationKey
      - name: LocationTaxonomies
        filter_column: LocationKey
      - name: LocationSupportedPrograms
        filter_column: LocationKey
      - name: PaymentSuspension
        filter_column: LocationKey
  stage4:
    database: "WiDHS.Qc.Carity.ToolTestig"
    schema: OrganizationModule
    tables:
      - name: Organization
        filter_column: OrganizationKey
      - name: Location
        filter_column: LocationKey

