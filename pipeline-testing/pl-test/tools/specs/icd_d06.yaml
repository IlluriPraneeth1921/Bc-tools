# ═══════════════════════════════════════════════════════════════════════════════
# CODE TABLES (Appendices A through I)
# ═══════════════════════════════════════════════════════════════════════════════

code_tables:
  provider_name_type_codes:
    name: provider_name_type_codes
    description: "Provider Name Type indicator"
    values:
      "B": "Business Name"
      "P": "Personal Name"

  organization_type_codes:
    name: organization_type_codes
    description: "Appendix A - Organization Type Codes"
    values:
      "1": "For Profit"
      "2": "Other"
      "3": "Partnership"
      "4": "Sole Proprietor"
      "5": "County Agency"
      "6": "Not for Profit"
      "7": "Limited Liability"
      "8": "State Agency"
      "9": "Municipality"
      "A": "Tribal Agency"
      "B": "City or County Agency"
      "C": "Federal Government"

  location_status_codes:
    name: location_status_codes
    description: "Location Status Indicator"
    values:
      "I": "In-state"
      "O": "Out of State"
      "Y": "Out of State Youth"
      "E": "In-state Emergency"

  billing_indicator_codes:
    name: billing_indicator_codes
    description: "Billing Indicator"
    values:
      "Y": "Biller"
      "N": "Performer"
      "B": "Biller and Performer"
      "R": "Referring/Prescribing/Ordering"

  address_type_codes:
    name: address_type_codes
    description: "Address Type Code"
    values:
      "S": "Practice/Service location"
      "M": "Mailing Address"
      "P": "Pay To Address"
      "I": "IRS 1099 Address"

  tax_id_type_codes:
    name: tax_id_type_codes
    description: "Tax ID Type"
    values:
      "S": "Social Security Number"
      "F": "FEIN"

  contract_enrollment_status_codes:
    name: contract_enrollment_status_codes
