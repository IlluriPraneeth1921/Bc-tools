# ═══════════════════════════════════════════════════════════════════════════════
# ICD-D06: WI DHS Medicaid Provider File Extract
# Generated from: Medicaid Provider File Extract Layout 01.12.26.pdf
#                  FG 2_WI DHS MES CMM_ICD-D06_v2.0 Unsubmitted Updates.xlsx
# ═══════════════════════════════════════════════════════════════════════════════

meta:
  interface_type: icd_d06
  display_name: "ICD-D06: WI DHS Medicaid Provider File Extract"
  description: "Daily full-file extract of all Medicaid Providers with active contracts within the last 24 months. Pipe-delimited with 15 record types (00-14)."
  version: "2.0"
  source_system: "MMIS"
  file_extension: ".psv"

format:
  type: pipe-delimited
  delimiter: "|"
  has_header_record: true
  has_trailer_record: false
  line_ending: CRLF
  encoding: UTF-8

entity:
  id_field: medicaid_provider_number
  id_length: 15
  test_prefix: "000000000"
  id_description: "Medicaid Provider Number (proprietary provider ID)"

record_types:
  - code: "00"
    name: "Extract File Information"
    min_occurrence: 1
    max_occurrence: "1"
    per_entity: false
    position: first_line
  - code: "01"
    name: "Main Provider Information"
    min_occurrence: 1
    max_occurrence: "1"
    per_entity: true
  - code: "02"
    name: "Provider Address"
    min_occurrence: 3
    max_occurrence: "10"
    per_entity: true
  - code: "03"
    name: "Provider TIN"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "04"
    name: "Provider Contract"
    min_occurrence: 1
    max_occurrence: unlimited
    per_entity: true
  - code: "05"
    name: "Provider Type and Specialty"
    min_occurrence: 1
    max_occurrence: unlimited
    per_entity: true
  - code: "06"
    name: "Provider NPI"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "07"
    name: "Provider Taxonomy"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "08"
    name: "Provider ACA Payment Hold"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "09"
    name: "Provider Value Added"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "10"
    name: "Provider Waiver Program"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "11"
    name: "Provider Waiver Service"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "12"
    name: "Provider County and Tribe Served"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "13"
    name: "Provider License"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true
  - code: "14"
    name: "Provider Certification and Credentials"
    min_occurrence: 0
    max_occurrence: unlimited
    per_entity: true

fields:
  # ─── Record Type 00: Extract File Information ─────────────────────────────
  "00":
    - name: record_type
      length: 2
      type: string
      required: true
      fixed_value: "00"
      db_column: RecordType
    - name: extract_date
      length: 8
      type: date
      format: YYYYMMDD
      required: true
      description: "Date extract is generated"
      db_column: ExtractDate
    - name: extract_period_start_date
      length: 8
      type: date
      format: YYYYMMDD
      description: "First date of extract reporting period (24 months in past)"
      db_column: ExtractPeriodStartDate
    - name: extract_period_end_date
      length: 8
      type: date
      format: YYYYMMDD
      description: "Last date of extract reporting period (current date)"
      db_column: ExtractPeriodEndDate
    - name: number_of_records
      length: 12
      type: numeric
      required: true
      zero_padded: true
      description: "Total rows excluding header"
      db_column: NumberOfRecords
    - name: number_of_providers
      length: 12
      type: numeric
      required: true
      zero_padded: true
      description: "Total unique MCD IDs"
      db_column: NumberOfProviders

  # ─── Record Type 01: Main Provider Information ────────────────────────────
  "01":
    - name: record_type
      length: 2
      type: string
      required: true
      fixed_value: "01"
      db_column: RecordType
    - name: medicaid_provider_number
      length: 15
      type: identifier
      required: true
      description: "Proprietary provider ID"
      db_column: MedicaidProviderNumber
    - name: provider_full_name
      length: 50
      type: string
      required: true
      description: "Organization name or personal name (Last 1-25, First 26-38, MI 39)"
      db_column: ProviderFullName
    - name: provider_name_type
      length: 1
      type: code
      required: true
      code_table: provider_name_type_codes
      description: "B=Business, P=Personal"
      db_column: ProviderNameType
    - name: organization_type_code
      length: 1
      type: code
      code_table: organization_type_codes
      description: "See Appendix A"
      db_column: OrganizationTypeCode
    - name: organization_type_description
      length: 25
      type: string
      required: true
      db_column: OrganizationTypeDescription
    - name: medicare_part_a
      length: 1
      type: string
      description: "A if certified for Medicare Part A"
      db_column: MedicarePartA
    - name: medicare_part_b
      length: 1
      type: string
      description: "B if certified for Medicare Part B"
      db_column: MedicarePartB
    - name: location_status_indicator
      length: 1
      type: code
      code_table: location_status_codes
      description: "I=In-state, O=Out of State, Y=Out of State Youth, E=Emergency"
      db_column: LocationStatusIndicator
    - name: billing_indicator
      length: 1
      type: code
      required: true
      code_table: billing_indicator_codes
      description: "Y=Biller, N=Performer, B=Both, R=Referring"
      db_column: BillingIndicator
    - name: xml_indicator
      length: 1
      type: flag
      description: "Y/N - can be included on XML provider file"
      db_column: XmlIndicator
    - name: provider_directory_indicator
      length: 1
      type: flag
      description: "Y/N - display on Provider Directory"
      db_column: ProviderDirectoryIndicator
    - name: medicaid_service_provider_count
      length: 5
      type: numeric
      description: "Only for waiver providers"
      db_column: MedicaidServiceProviderCount
    - name: medicaid_member_count
      length: 5
      type: numeric
      description: "Only for waiver providers"
      db_column: MedicaidMemberCount
    - name: revalidation_date
      length: 8
      type: date
      format: YYYYMMDD
      required: true
      description: "Provider review date (usually every 3 years)"
      db_column: RevalidationDate
    - name: ltc_third_party_delegate_action_indicator
      length: 1
      type: flag
      description: "Y/N - third-party action taken"
      db_column: LtcThirdPartyDelegateActionIndicator
    - name: ltc_third_party_delegate_last_action_date
      length: 8
      type: date
      format: YYYYMMDD
      description: "Most recent third-party delegate action date"
      db_column: LtcThirdPartyDelegateLastActionDate

  # ─── Record Type 02: Provider Address ─────────────────────────────────────
  "02":
    - name: record_type
      length: 2
      type: string
      required: true
      fixed_value: "02"
      db_column: RecordType
    - name: medicaid_provider_number
      length: 15
      type: identifier
      required: true
      db_column: MedicaidProviderNumber
    - name: address_type_code
      length: 1
      type: code
      required: true
      code_table: address_type_codes
      description: "S=Practice, M=Mailing, P=Pay To, I=IRS 1099"
      db_column: AddressTypeCode
    - name: name_address_specific
      length: 50
      type: string
      description: "Name associated with this address type"
      db_column: NameAddressSpecific
    - name: street_address_1
      length: 30
      type: string
      required: true
      db_column: StreetAddress1
    - name: street_address_2
      length: 30
      type: string
      db_column: StreetAddress2
    - name: city
      length: 30
      type: string
      required: true
      db_column: City
    - name: state
      length: 2
      type: string
      required: true
      db_column: State
    - name: zip_code
      length: 5
      type: string
      required: true
      db_column: ZipCode
    - name: zip_code_extension
      length: 4
      type: string
      db_column: ZipCodeExtension
    - name: practice_location_county_code
      length: 10
      type: string
      description: "Only for Address Type S"
      db_column: PracticeLocationCountyCode
    - name: email_address
      length: 256
      type: string
      description: "Only for Address Type M"
      db_column: EmailAddress
    - name: contact_person
      length: 50
      type: string
      description: "Only for Address Type S and P"
      db_column: ContactPerson
    - name: phone_number_contact_person
      length: 10
      type: string
      description: "Only for Address Type S and P"
      db_column: PhoneNumberContactPerson
    - name: phone_number_extension_contact_person
      length: 4
      type: string
      description: "Only for Address Type S and P"
      db_column: PhoneNumberExtensionContactPerson
    - name: phone_number_member_use
      length: 10
      type: string
      description: "Only for Address Type S"
      db_column: PhoneNumberMemberUse

  # ─── Record Type 03: Provider TIN ─────────────────────────────────────────
  "03":
    - name: record_type
      length: 2
      type: string
      fixed_value: "03"
      db_column: RecordType
    - name: medicaid_provider_number
      length: 15
      type: identifier
      db_column: MedicaidProviderNumber
    - name: tax_id_number
      length: 9
      type: string
      description: "Tax Identification Number (IRS)"
      db_column: TaxIdNumber
    - name: tax_id_type
      length: 1
      type: code
      code_table: tax_id_type_codes
      description: "S=SSN, F=FEIN"
      db_column: TaxIdType
    - name: tin_effective_date
      length: 8
      type: date
      format: YYYYMMDD
      db_column: TinEffectiveDate
    - name: tin_end_date
      length: 8
      type: date
      format: YYYYMMDD
      db_column: TinEndDate

  # ─── Record Type 04: Provider Contract ────────────────────────────────────
  "04":
    - name: record_type
      length: 2
      type: string
      fixed_value: "04"
      db_column: RecordType
    - name: medicaid_provider_number
      length: 15
      type: identifier
      db_column: MedicaidProviderNumber
    - name: provider_contract_code
      length: 5
      type: string
      description: "e.g., MEDSV, WVR, DENTL"
      db_column: ProviderContractCode
    - name: contract_effective_date
      length: 8
      type: date
      format: YYYYMMDD
      db_column: ContractEffectiveDate
    - name: contract_end_date
      length: 8
      type: date
      format: YYYYMMDD
      db_column: ContractEndDate
    - name: contract_enrollment_status_code
      length: 1
      type: code
      code_table: contract_enrollment_status_codes
      description: "See Appendix B"
      db_column: ContractEnrollmentStatusCode
    - name: contract_enrollment_status_description
      length: 21
      type: string
      db_column: ContractEnrollmentStatusDescription

  # ─── Record Type 05: Provider Type and Specialty ──────────────────────────
  "05":
    - name: record_type
      length: 2
      type: string
      required: true
      fixed_value: "05"
      db_column: RecordType
    - name: medicaid_provider_number
      length: 15
      type: identifier
      required: true
      db_column: MedicaidProviderNumber
    - name: provider_type_code
      length: 2
      type: string
      required: true
      db_column: ProviderTypeCode
    - name: provider_type_description
      length: 50
      type: string
      db_column: ProviderTypeDescription
    - name: provider_specialty_code
      length: 3
      type: string
      required: true
      db_column: ProviderSpecialtyCode
    - name: provider_specialty_description
      length: 50
      type: string
      db_column: ProviderSpecialtyDescription
    - name: provider_type_specialty_effective_date
      length: 8
      type: date
      format: YYYYMMDD
      required: true
      db_column: ProviderTypeSpecialtyEffectiveDate
    - name: provider_type_specialty_end_date
      length: 8
      type: date
      format: YYYYMMDD
      required: true
      db_column: ProviderTypeSpecialtyEndDate

  # ─── Record Type 06: Provider NPI ─────────────────────────────────────────
  "06":
    - name: record_type
      length: 2
      type: string
      fixed_value: "06"
      db_column: RecordType
    - name: medicaid_provider_number
      length: 15
      type: identifier
      db_column: MedicaidProviderNumber
    - name: npi
      length: 15
      type: identifier
      description: "National Provider Identifier"
      db_column: Npi
    - name: npi_effective_date
      length: 8
      type: date
      format: YYYYMMDD
      db_column: NpiEffectiveDate
    - name: npi_end_date
      length: 8
      type: date
      format: YYYYMMDD
      db_column: NpiEndDate
    - name: npi_type_description
      length: 50
      type: string
      description: "NPI or Subpart NPI"
      db_column: NpiTypeDescription

  # ─── Record Type 07: Provider Taxonomy ────────────────────────────────────
  "07":
    - name: record_type
      length: 2
      type: string
      fixed_value: "07"
      db_column: RecordType
    - name: medicaid_provider_number
      length: 15
      type: identifier
      db_column: MedicaidProviderNumber
    - name: taxonomy_code
      length: 10
      type: string
      description: "Provider taxonomy code (alphanumeric with X suffix)"
      db_column: TaxonomyCode
    - name: taxonomy_effective_date
      length: 8
      type: date
      format: YYYYMMDD
      db_column: TaxonomyEffectiveDate
    - name: taxonomy_end_date
      length: 8
      type: date
      format: YYYYMMDD
      db_column: TaxonomyEndDate

  # ─── Record Type 08: Provider ACA Payment Hold ────────────────────────────
  "08":
    - name: record_type
      length: 2
