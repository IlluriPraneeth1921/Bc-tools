# ═══════════════════════════════════════════════════════════════════════════════
# BUSINESS RULES
# ═══════════════════════════════════════════════════════════════════════════════

business_rules:
  - id: BR-D06-001
    description: "IRIS Organization Providers (Waiver Program=IRIS, PTPS != 90/979) not in BC → create new Org + Location"
    affects_fields: [waiver_program_code, provider_type_code, provider_specialty_code]
    logic: "waiver_program_code='IRIS' AND NOT (provider_type='90' AND specialty='979') AND not_in_BC → CREATE"
    type: filter
  - id: BR-D06-002
    description: "EVV Providers (Provider Type=85, Specialty=858) not in BC → create new Org + Location"
    affects_fields: [provider_type_code, provider_specialty_code]
    logic: "provider_type='85' AND specialty='858' AND not_in_BC → CREATE"
    type: filter
  - id: BR-D06-004
    description: "Match existing providers by Medicaid Provider Number for updates"
    affects_fields: [medicaid_provider_number]
    logic: "Match on medicaid_provider_number → UPDATE existing"
    type: transformation
  - id: BR-D06-005
    description: "PHW providers (Type=90, Specialty=979) do NOT create new records"
    affects_fields: [provider_type_code, provider_specialty_code]
    logic: "provider_type='90' AND specialty='979' → SKIP new creation"
    type: filter
  - id: BR-D06-006
    description: "Waiver Program End Date < current date → end IRIS program association, set status Inactive"
    affects_fields: [waiver_program_end_date]
    logic: "waiver_program_end_date < today → end SupportedPrograms, set Org+Location status='Inactive'"
    type: transformation
  - id: BR-D06-007
    description: "Waiver Program End Date < current date → end-date associated Service Authorizations"
    affects_fields: [waiver_program_end_date]
    logic: "waiver_program_end_date < today → trigger automation to end-date SAs"
    type: transformation
  - id: BR-D06-008
    description: "Waiver Service End Date captures last date provider can perform service"
    affects_fields: [waiver_service_end_date]
    logic: "Store as EffectiveDateRangeEndDate on LocationExtensionWaiverServices"
    type: transformation
  - id: BR-D06-009
    description: "Billing Indicator B (Both) → Location Type = Waiver Service Provider"
    affects_fields: [billing_indicator]
    logic: "billing_indicator='B' → LocationType.PrimaryTypeDisplayName='Waiver Service Provider'"
    type: transformation
  - id: BR-D06-010
    description: "Billing Indicator Y (Biller) → Location Type = Waiver Service Provider"
    affects_fields: [billing_indicator]
    logic: "billing_indicator='Y' → LocationType.PrimaryTypeDisplayName='Waiver Service Provider'"
    type: transformation
  - id: BR-D06-011
    description: "Billing Indicator N (Performer) → Location Type = Waiver Service Provider"
    affects_fields: [billing_indicator]
    logic: "billing_indicator='N' → LocationType.PrimaryTypeDisplayName='Waiver Service Provider'"
    type: transformation
  - id: BR-D06-012
    description: "Billing Indicator R (Referring) → provider NOT loaded into Blue Compass"
    affects_fields: [billing_indicator]
    logic: "billing_indicator='R' → SKIP entire provider"
    type: filter
  - id: BR-D06-013
    description: "Each MCD ID = one Organization + one Location in Blue Compass"
    affects_fields: [medicaid_provider_number]
    logic: "1 MCD ID → 1 Org + 1 Location"
    type: transformation
  - id: BR-D06-015
    description: "Waiver Service Codes determine what services a provider can perform"
    affects_fields: [waiver_service_code]
    logic: "Store in LocationExtensionWaiverServices with effective dates"
    type: transformation
  - id: BR-D06-016
    description: "Generate Error Report after processing each inbound file"
    affects_fields: []
    logic: "Log row for each provider failing required business rules"
    type: validation
  - id: BR-D06-018
    description: "Rendering/Location Address (S) must be Current; only one address can be Current=Yes"
    affects_fields: [address_type_code]
    logic: "address_type='S' → CurrentDisplayName='Yes', IsPrimary=1; others → 'No', IsPrimary=0"
    type: transformation
  - id: BR-D06-019
    description: "Zip codes must be numeric, 5 digits or 10 with dash (12345 or 12345-6789)"
    affects_fields: [zip_code, zip_code_extension]
    logic: "Concatenate zip_code + '-' + zip_code_extension → PhysicalAddressPostalCode"
    type: transformation
  - id: BR-D06-020
    description: "StatusDisplayName=Active requires: WVR contract (status A, current dates) AND IRIS waiver program (current dates)"
    affects_fields: [provider_contract_code, contract_enrollment_status_code, waiver_program_code]
    logic: "Contract 'WVR' (status=A, current) AND WaiverProgram 'IRIS' (current) → 'Active', else 'Inactive'"
    type: composite
  - id: BR-D06-021
    description: "Taxonomy code resolves Grouping/Classification/Specialization from vocabulary lookup"
    affects_fields: [taxonomy_code]
    logic: "Lookup taxonomy_code in LocationTaxonomy vocab → GroupingName, ClassificationName, SpecializationName"
    type: vocab_lookup
  - id: BR-D06-022
    description: "NPI dedup: load only the most recent NPI (by effective date, then end date)"
    affects_fields: [npi, npi_effective_date, npi_end_date]
    logic: "Multiple NPIs per provider → keep most recent effective date; ties broken by latest end date"
    type: filter
  - id: BR-D06-023
    description: "TIN dedup: load only most recent TIN per type (by effective date, then end date)"
    affects_fields: [tax_id_number, tax_id_type, tin_effective_date, tin_end_date]
    logic: "Multiple TINs same type → keep most recent effective date; ties broken by latest end date"
    type: filter

cross_field_dependencies:
  - condition: "If provider_name_type = 'P', name is formatted as Last(1-25) First(26-38) MI(39)"
    fields: [provider_name_type, provider_full_name]
  - condition: "Contact Person only populated for Address Type S and P"
    fields: [address_type_code, contact_person, phone_number_contact_person]
  - condition: "Email Address only populated for Address Type M"
    fields: [address_type_code, email_address]
  - condition: "Practice Location County Code only populated for Address Type S"
    fields: [address_type_code, practice_location_county_code]
  - condition: "Phone Number Member Use only populated for Address Type S"
    fields: [address_type_code, phone_number_member_use]
  - condition: "BR-D06-020: Active status requires WVR contract + IRIS program both current"
    fields: [provider_contract_code, contract_enrollment_status_code, waiver_program_code, waiver_program_effective_date, waiver_program_end_date]

# ═══════════════════════════════════════════════════════════════════════════════
# DATABASE TARGETS
# ═══════════════════════════════════════════════════════════════════════════════

db_targets:
  stage1:
    database: "WiDHS.Qc.Interface.Carity.ToolTesting"
    schema: CustomerInterfaceModule
    tables:
      - name: MedicaidProviderRaw
        columns:
          record_type: RecordType
          medicaid_provider_number: MedicaidProviderNumber
        filter_column: MedicaidProviderNumber

  stage2:
    database: "WiDHS.Qc.Interface.Carity.ToolTesting"
    schema: CustomerInterfaceModule
    tables:
      - name: MedicaidProviderMain
        record_type: "01"
        columns:
          medicaid_provider_number: MedicaidProviderNumber
          provider_full_name: ProviderFullName
          provider_name_type: ProviderNameType
          organization_type_code: OrganizationTypeCode
          billing_indicator: BillingIndicator
          revalidation_date: RevalidationDate
        filter_column: MedicaidProviderNumber
      - name: MedicaidProviderAddress
        record_type: "02"
        columns:
          medicaid_provider_number: MedicaidProviderNumber
          address_type_code: AddressTypeCode
          street_address_1: StreetAddress1
          city: City
          state: State
          zip_code: ZipCode
        filter_column: MedicaidProviderNumber
      - name: MedicaidProviderTin
        record_type: "03"
        columns:
          medicaid_provider_number: MedicaidProviderNumber
          tax_id_number: TaxIdNumber
          tax_id_type: TaxIdType
        filter_column: MedicaidProviderNumber
      - name: MedicaidProviderContract
        record_type: "04"
        columns:
          medicaid_provider_number: MedicaidProviderNumber
          provider_contract_code: ProviderContractCode
          contract_enrollment_status_code: ContractEnrollmentStatusCode
        filter_column: MedicaidProviderNumber
      - name: MedicaidProviderTypeAndSpecialty
        record_type: "05"
        columns:
          medicaid_provider_number: MedicaidProviderNumber
          provider_type_code: ProviderType
          provider_specialty_code: ProviderSpecialtyCode
        filter_column: MedicaidProviderNumber
      - name: MedicaidProviderNpi
        record_type: "06"
        columns:
          medicaid_provider_number: MedicaidProviderNumber
          npi: Npi
        filter_column: MedicaidProviderNumber
      - name: MedicaidProviderTaxonomy
        record_type: "07"
        columns:
          medicaid_provider_number: MedicaidProviderNumber
          taxonomy_code: Taxonomy
        filter_column: MedicaidProviderNumber

  stage3:
    database: "WiDHS.Qc.Interface.Carity.ToolTesting"
    schema: InterfaceModule
    tables:
      - name: IncomingOrganization
        columns:
          medicaid_provider_number: CustomerProviderIdentifier
        filter_column: CustomerProviderIdentifier
      - name: IncomingOrganizationIdentifiers
        columns:
          medicaid_provider_number: CustomerProviderIdentifier
        filter_column: CustomerProviderIdentifier
      - name: IncomingOrganizationAddresses
        columns:
          medicaid_provider_number: CustomerProviderIdentifier
        filter_column: CustomerProviderIdentifier
      - name: IncomingLocation
        columns:
          medicaid_provider_number: CustomerProviderIdentifier
        filter_column: CustomerProviderIdentifier
      - name: IncomingLocationIdentifiers
        columns:
          medicaid_provider_number: CustomerProviderIdentifier
        filter_column: CustomerProviderIdentifier

  stage4:
    database: "WiDHS.Qc.Carity.ToolTestig"
    schema: OrganizationModule
    tables:
      - name: Organization
        columns:
          medicaid_provider_number: CustomerProviderIdentifier
        filter_column: CustomerProviderIdentifier
      - name: OrganizationIdentifiers
        filter_column: Value
      - name: Location
        filter_column: CustomerProviderIdentifier
      - name: LocationIdentifiers
        filter_column: Value

# ═══════════════════════════════════════════════════════════════════════════════
# FILE NAMING & TEST CONFIG
# ═══════════════════════════════════════════════════════════════════════════════

naming:
  file_prefix: WI_PROV_FILE_EXTRACT
  environment_suffix: "_T"
  extension: ".psv"

test_scenarios:
  volume_size: 50
  mutations:
    - code: UPD01
      name: ADDRESS_CHANGES
      description: "Provider addresses updated (street, city, zip, county)"
      fields_affected: [street_address_1, city, zip_code, practice_location_county_code]
    - code: UPD02
      name: CONTRACT_STATUS
      description: "Contract terminations, new contracts, status transitions"
      fields_affected: [provider_contract_code, contract_enrollment_status_code, contract_end_date]
    - code: UPD03
      name: DEMOGRAPHICS
      description: "Provider name, org type, billing indicator changes"
      fields_affected: [provider_full_name, organization_type_code, billing_indicator]
    - code: UPD04
      name: NPI_TAXONOMY
      description: "NPI replacements, new NPIs, taxonomy changes"
      fields_affected: [npi, npi_effective_date, npi_end_date, taxonomy_code]
    - code: UPD05
      name: WAIVER_CHANGES
      description: "New waiver enrollment, program end-dates, service activations"
      fields_affected: [waiver_program_code, waiver_program_end_date, waiver_service_code]
    - code: UPD06
      name: NEW_PROVIDERS
      description: "Brand new providers appearing in extract"
      fields_affected: [medicaid_provider_number]
    - code: UPD07
      name: TERM_REACTIVATION
      description: "Provider terminated then reactivated same day"
      fields_affected: [contract_enrollment_status_code, contract_end_date]
  deletions:
    - code: DEL01
      name: PROVIDER_REMOVED
      description: "Provider no longer in extract (terminated)"
    - code: DEL02
      name: SUBRECORD_REMOVED
      description: "Sub-records (address, NPI, contract) removed"
    - code: DEL03
      name: WAIVER_RECORDS_REMOVED
      description: "Waiver program/service records removed"
