      db_column: AcaPaymentHoldEndDate
    - name: aca_payment_hold_indicator
      length: 1
      type: code
      code_table: aca_payment_hold_codes
      description: "A=Active suspension, C=Cleared, T=Terminated"
      db_column: AcaPaymentHoldIndicator

  # ─── Record Type 09: Provider Value Added ─────────────────────────────────
  "09":
    - name: record_type
      length: 2
      type: string
      fixed_value: "09"
      db_column: RecordType
    - name: medicaid_provider_number
      length: 15
      type: identifier
