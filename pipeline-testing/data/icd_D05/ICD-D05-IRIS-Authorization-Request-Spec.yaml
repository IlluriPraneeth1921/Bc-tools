    tables:
      - name: "IrisAuthorizationRequest"
        record_type: "DTL"
        columns:
          record_type: "RecordType"
          record_number: "RecordNumber"
          member_id: "MemberId"
          billing_provider_id: "BillingProviderId"
          authorization_number: "AuthorizationNumber"
          authorization_status: "AuthorizationStatus"
          service_code: "ServiceCode"
          modifier_1: "Modifier1"
          modifier_2: "Modifier2"
          modifier_3: "Modifier3"
          modifier_4: "Modifier4"
          authorized_effective_date: "AuthorizedEffectiveDate"
          authorized_end_date: "AuthorizedEndDate"
          authorization_type: "AuthorizationType"
          participant_dob: "ParticipantDob"
          participant_ssn: "ParticipantSsn"
          participant_name: "ParticipantName"
          rendering_provider_id: "RenderingProviderId"
          rendering_qualifier_id: "RenderingQualifierId"
          rendering_provider_npi: "RenderingProviderNpi"
          billing_provider_id_dup: "BillingProviderIdDup"
          billing_qualifier_id: "BillingQualifierId"
          billing_provider_npi: "BillingProviderNpi"
          service_code_qualifier: "ServiceCodeQualifier"
          service_description: "ServiceDescription"
          total_dollar_amount: "TotalDollarAmount"
          total_units: "TotalUnits"
          unit_rate: "UnitRate"
          unit_type: "UnitType"
          frequency: "Frequency"
          units_by_frequency: "UnitsByFrequency"
          created_date: "CreatedDate"
          updated_date: "UpdatedDate"
          participant_status: "ParticipantStatus"
          retroactive_auth_reason_code: "RetroactiveAuthReasonCode"
          units_change_reason_code: "UnitsChangeReasonCode"
        filter_column: "AuthorizationNumber"
    mapping: "one_row_per_record"
  stage2:
    database: "WiDHS.Qc.Interface.Carity.ToolTesting"
    schema: "CustomerInterfaceModule"
    tables: []
    mapping: "one_row_per_record"
  stage3:
    database: "WiDHS.Qc.Interface.Carity.ToolTesting"
    schema: "CustomerInterfaceModule"
    tables: []
    mapping: "one_row_per_record"
  stage4:
    database: "WiDHS.Qc.Interface.Carity.ToolTesting"
    schema: "CustomerInterfaceModule"
    tables: []
    mapping: "one_row_per_record"

# =============================================================================
# TEST SCENARIOS
# =============================================================================
test_scenarios:
  standard:
    - "baseline"
    - "max_lengths"
    - "min_empty"
    - "boundary_dates"
    - "all_codes"
    - "special_chars"
    - "large_volume"
    - "composite_rules"
  extended:
    - "cross_field"
  mutations:
    - code: "UPD01"
      name: "AUTH_STATUS_CHANGE"
      description: "Authorization status changes from Active to Voided"
      fields_affected: ["authorization_status", "authorization_type"]
    - code: "UPD02"
      name: "PROVIDER_CHANGE"
      description: "Billing or rendering provider ID changes"
      fields_affected: ["billing_provider_id", "rendering_provider_id", "billing_qualifier_id", "rendering_qualifier_id"]
    - code: "UPD03"
      name: "UNITS_CHANGE"
      description: "Changes to units, rate, or dollar amount"
      fields_affected: ["total_units", "unit_rate", "total_dollar_amount", "units_by_frequency"]
    - code: "UPD04"
      name: "DATE_CHANGE"
      description: "Changes to effective or end date"
      fields_affected: ["authorized_effective_date", "authorized_end_date", "updated_date"]
    - code: "UPD05"
      name: "SERVICE_CODE_CHANGE"
      description: "Changes to service code or modifiers"
      fields_affected: ["service_code", "modifier_1", "modifier_2", "modifier_3", "modifier_4", "service_code_qualifier"]
    - code: "UPD06"
      name: "NEW_AUTHORIZATIONS"
      description: "New authorizations added to the file"
      fields_affected: ["authorization_number", "authorization_type"]
    - code: "UPD07"
      name: "ADDITIONAL_PROVIDERS"
      description: "Additional provider DTL records added per BR-005-028"
      fields_affected: ["authorization_number", "record_number", "rendering_provider_id", "rendering_qualifier_id", "rendering_provider_npi"]
  deletions:
    - code: "DEL01"
      name: "AUTH_VOIDED"
      description: "Authorization voided/deleted (status V, type 2)"
    - code: "DEL02"
      name: "SERVICE_LINE_CANCELLED"
      description: "Individual service line cancelled within an authorization"
    - code: "DEL03"
      name: "MULTIPLE_VOIDED"
      description: "Multiple authorizations voided in same file"
    - code: "DEL04"
      name: "ADDITIONAL_PROVIDER_REMOVED"
      description: "Additional provider DTL record removed"
  volume_size: 50
