          sbtnc_abus_cur_flg: "SubstanceAbuseCurrentFlag"
          sbtnc_abus_past_flg: "SubstanceAbusePastFlag"
          elg_calc_dt: "EligibilityCalculatedDate"
        # System-managed columns (not from source file, populated by pipeline)
        system_columns:
          - "LongTermCareFunctionalScreenFormKey"  # PK (GUID)
          - "PersonKey"            # Resolved by person matching (BR-D12-005)
          - "HasErrors"            # Set by pipeline validation
          - "IsReadyToProcess"     # Set by pipeline after validation
          - "CustomFormInstanceKey" # Set after Stage 3 form creation
          - "InterfaceBatchKey"    # Batch identifier for this file load
          - "LastSynchronizationTimestamp"  # Pipeline processing timestamp
        filter_column: "MemberId"
    mapping: "one_row_per_record"

  stage3:
    database: "N/A"
    schema: "N/A"
    description: "SKIPPED — ICD-D12 data flows directly from Stage 2 to Stage 4. There is no intermediate transformation stage in the Interface DB."
    tables: []
    mapping: "skipped"
    notes: "Stage 3 is not applicable for ICD-D12. The pipeline transforms Stage 2 parsed data directly into Carity DB CustomFormModule tables (Stage 4)."

  stage4:
    database: "WiDHS.Qc.Carity.ToolTesting"
    schema: "CustomFormModule"
    description: "Final transformed data in Carity DB. Creates/updates LTC Needs Assessment custom form instances and populates field answers from FSIA data."
    custom_form_definition_key: "964B0DFB-ED99-4F5A-8449-B43C013B9062"
    custom_form_definition_version: 55
    tables:
      - name: "CustomFormInstance"
        description: "One instance per member per file load. Linked to CustomFormDefinition via CustomFormDefinitionKey."
        primary_key: "CustomFormInstanceKey"
        columns:
          _form_definition: "CustomFormDefinitionKey"  # 964B0DFB-ED99-4F5A-8449-B43C013B9062
          _version: "Version"  # 55
        filter_column: "CustomFormDefinitionKey"
        filter_type: "guid"
      - name: "CaseCustomFormInstance"
        description: "Links custom form instance to a case. One record per form instance."
        primary_key: "CaseCustomFormInstanceKey"
        columns:
          _form_instance: "CustomFormInstanceKey"
          _case: "CaseKey"
        filter_column: "CustomFormInstanceKey"
        filter_type: "fk_to_CustomFormInstance"
      - name: "FieldAnswerBase"
        description: "One record per field answer. Links to CustomFormInstance and CustomFormElementDefinitionBase."
        primary_key: "FieldAnswerBaseKey"
        columns:
          _form_instance: "CustomFormInstanceKey"
          _element_def: "CustomFormElementDefinitionBaseKey"
          _index: "IndexNumber"
        filter_column: "CustomFormInstanceKey"
        filter_type: "fk_to_CustomFormInstance"
      - name: "SimpleSingleSelectFieldAnswer"
        description: "Yes/No dropdown answers for composite business rule fields (PersonalCare, SupportiveHomeCare, MedAdmin, MoneyMgt, Transportation, DME, PrefLive, OvernightCare)."
        primary_key: "FieldAnswerBaseKey"
        columns:
          _answer_base: "FieldAnswerBaseKey"
          _option_code: "OptionCode"
          _option_display: "OptionDisplayName"
        filter_column: "FieldAnswerBaseKey"
        filter_type: "fk_to_FieldAnswerBase"
      - name: "DateFieldAnswer"
        description: "Date field answers. Note: ELG_CALC_DT is NOT stored as a form field per v2.0 (mapping removed)."
        primary_key: "FieldAnswerBaseKey"
        columns:
          _answer_base: "FieldAnswerBaseKey"
        filter_column: "FieldAnswerBaseKey"
        filter_type: "fk_to_FieldAnswerBase"
        notes: "ELG_CALC_DT mapping removed in v2.0. Field is still present in file layout but is not stored as a form field."
    mapping: "one_form_instance_per_member"
    notes: "Stage 4 uses CustomFormDefinitionKey 964B0DFB-ED99-4F5A-8449-B43C013B9062 (Version 55). Business rules determine composite Yes/No field values. PersonEmployment records are also created in PersonModule."

# =============================================================================
# TEST SCENARIOS
# =============================================================================
test_scenarios:
  standard:
    - "baseline"
    - "max_lengths"
    - "min_empty"
    - "boundary_dates"
    - "all_codes"
    - "special_chars"
    - "large_volume"
    - "composite_rules"
  extended:
    - "cross_field"
  mutations:
    - code: "UPD01"
      name: "ADL_CHANGES"
      description: "Changes to ADL help levels and adaptive equipment"
      fields_affected: ["bath_help_cd", "dres_help_cd", "eat_help_cd", "mbl_help_cd", "tlt_help_cd", "xfer_help_cd", "bath_adpv_eqp_cd", "mbl_adpv_eqp_cd", "tlt_adpv_eqp_cd", "xfer_adpv_eqp_cd"]
    - code: "UPD02"
      name: "EMPLOYMENT_CHANGES"
      description: "Changes to employment status and flags"
      fields_affected: ["empl_stat_cd", "wkshp_empl_flg", "indv_int_work_cmny_cd", "cmny_empl_flg", "voc_empl_flg", "home_empl_flg", "empl_asst_cd"]
    - code: "UPD03"
      name: "HEALTH_SERVICES"
      description: "Changes to health related service codes"
      fields_affected: ["bhv_itrvn_cd", "exrc_rng_motn_cd", "med_fld_flush_cd", "med_adm_cd", "pain_med_mgt_cd", "osty_cd", "chr_bed_posn_cd", "oxy_rspir_trtm_cd", "in_home_dlys_cd", "tot_prnt_ntrt_cd", "xfsn_cd", "trchos_cd", "tube_feed_cd", "ulcr_stg_2_cd", "ulcr_stg_3_4_cd", "urin_cath_cd", "othr_wnd_care_cd", "vent_itrvn_cd", "nurs_ases_cd", "othr_srvc_cd", "skl_thrp_cd"]
    - code: "UPD04"
      name: "COGNITION_CHANGES"
      description: "Changes to communication, memory, and cognition fields"
      fields_affected: ["comm_cd", "mem_ipar_flg", "shrt_term_mem_loss_flg", "uabl_to_rmbr_flg", "long_term_mem_loss_flg", "dly_dcsn_make_cd", "phy_rsist_care_cd"]
    - code: "UPD05"
      name: "ELIGIBILITY_DATE"
      description: "Change to eligibility determination date"
      fields_affected: ["elg_calc_dt"]
    - code: "UPD06"
      name: "NEW_MEMBERS"
      description: "New members added to the file"
      fields_affected: ["medicaid_id"]
  deletions:
    - code: "DEL01"
      name: "MEMBER_REMOVED"
      description: "Member no longer appears in file (not applicable per spec but tested for robustness)"
    - code: "DEL02"
      name: "SERVICES_CLEARED"
      description: "All health service codes reset to independent/blank"
    - code: "DEL03"
      name: "MULTIPLE_REMOVED"
      description: "Multiple members removed from file"
    - code: "DEL04"
      name: "ADL_INDEPENDENCE"
      description: "All ADL codes reset to 000 (independent)"
  volume_size: 50
